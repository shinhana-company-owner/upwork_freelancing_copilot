[project]
name = "upwork-copilot-skill"
version = "0.1.0"
description = "Self-contained, LLM-free data CLI for the Upwork Copilot Claude skill."
requires-python = ">=3.10,<3.14"
# The skill does NO LLM calls (the host model is the brain), so it needs only the
# MCP client + an optional .env loader. None of the CrewAI/litellm stack.
dependencies = [
    # Pinned to the 1.x line the data layer is written against (the parent repo
    # locks mcp 1.26.0). mcp 2.x renamed streamablehttp_client -> streamable_http_client.
    "mcp>=1.2.0,<2",
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The bundled package lives under scripts/ (generated by ../build_skill.py).
[tool.hatch.build.targets.wheel]
packages = ["scripts/upwork_agent"]
